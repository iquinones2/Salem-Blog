project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
  resources:
    - images/icons/sprout.svg
    - assets/js/config.js
    - assets/js/subscriber-store.js
    - assets/js/*-page.js

website:
  title: "Salem"
  site-url: "https://iquinones2.github.io/Salem-Blog"
  favicon: "images/Salem.jpg"
  navbar:
    logo: images/SalemT.png
    logo-alt: "Salem Custom Screen Printing logo"
    pinned: true
    collapse-below: xl   # full menu only from 1200px; see "Header layout" in styles.css
    right:
      - text: Shop
        href: shop.qmd
      - text: Journal
        href: index.qmd#journal
      - text: About
        href: about.qmd
      - text: Instagram
        href: https://www.instagram.com/salem.csp5/
      - text: Facebook
        href: https://www.facebook.com/profile.php?id=61590308556408
      - text: Join the Salem list
        href: subscribe.qmd
format:
  html:
    theme:
      light: [lux, assets/scss/salem-light.scss]
      dark: [lux, assets/scss/salem-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600&family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      - file: _partials/site-settings.html

filters:
  - assets/lua/i18n.lua

editor: visual

